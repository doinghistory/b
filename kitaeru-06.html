<main><section class="intro"><h1>鍛える</h1><p>縦に長く読むのではなく、演習の段階を横へ送る案。巻物や屏風を見る感覚を、操作そのものに使います。</p></section><section class="rail"><article class="panel"><img src="https://upload.wikimedia.org/wikipedia/commons/1/19/M%C5%8Dko_Sh%C5%ABrai_Ekotoba.jpg" alt="蒙古襲来絵詞"><div class="copy"><small>01</small><h2>解く</h2><p>まずは単元別の基本問題。知識の抜けを確認します。</p></div></article><article class="panel"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Battle_of_Sekigahara_folding_screen.jpg?width=2200" alt="関ヶ原合戦図屏風"><div class="copy"><small>02</small><h2>見抜く</h2><p>正誤・組合せ問題で、似た内容の違いを整理します。</p></div></article><article class="panel"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Genji_emaki_sekiya.jpg?width=2200" alt="源氏物語絵巻"><div class="copy"><small>03</small><h2>挑む</h2><p>過去問や複合問題で、知識を使う段階へ進みます。</p></div></article></section><div class="hint">横にスクロールして進む →</div></main><footer class="footer"><span>歴史する　高校日本史</span><span>レイアウト検証版</span></footer></body></html>
