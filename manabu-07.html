<main><section class="mast"><h1>学ぶ</h1><p>日本史授業資料室　時代別教材・史料</p></section><section class="paper"><article class="lead"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Ban_dainagon_ekotoba.jpg?width=2200" alt="伴大納言絵詞"><h2>史料から、その時代を読む。</h2><p>授業プリントを中心に、史料・図像・用語を同じ紙面に置く案です。Webサイトというより、新聞の特集面や資料集のような密度を狙います。</p></article><aside class="index"><a class="era" href="#"><b>古代</b><p>国家形成、律令、平安文化</p></a><a class="era" href="#"><b>中世</b><p>武士政権、荘園、都市と宗教</p></a><a class="era" href="#"><b>近世</b><p>統一、幕藩体制、社会と文化</p></a><a class="era" href="#"><b>近代</b><p>国家形成、帝国、戦争と社会</p></a><a class="era" href="#"><b>現代</b><p>占領、成長、現代社会</p></a><a class="era" href="#"><b>横断</b><p>テーマ・史料・論点から探す</p></a></aside></section></main><footer class="footer"><span>歴史する　高校日本史</span><span>レイアウト検証版</span></footer></body></html>
